[package]
name = "parallax-lab"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Probal Bose"]
description = "Paired Python-Rust experiments for LLM training systems."
publish = false

[[bin]]
name = "hardware_snapshot"
path = "src/bin/hardware_snapshot.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39"
