name: Bug report
description: Report a reproducible defect in Parallax.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, private data, or model weights. Use SECURITY.md for vulnerabilities."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands, config, and expected versus actual behaviour.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, chip, Python/Rust version, backend
    validations:
      required: true
